name: Bug report
description: Something in the app is broken.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect and what happened instead?
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Speaker Awake version
      placeholder: "1.0.0 (shown at the bottom-left of the window)"
    validations: { required: true }
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
